name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" "pyinstaller==6.22.3"
      - run: python -c "import tree_sitter_bash"
      - run: python -m pytest boxdawn_guard -q
      # PyInstaller does not cross-compile: each OS builds its own binary.
      - run: pyinstaller packaging/bdxguard.spec --noconfirm
      # Fails the job if the binary's output differs from the Python code's
      # on any sample command.
      - name: binary matches the Python code
        shell: bash
        run: |
          exe=dist/bdxguard/bdxguard
          [ -f "$exe.exe" ] && exe="$exe.exe"
          python packaging/check_binary.py "$exe" 21
      - uses: actions/upload-artifact@v4
        with:
          name: bdxguard-${{ runner.os }}-${{ runner.arch }}
          path: dist/bdxguard
          retention-days: 7

  # One plugin carries every OS's build; place.sh / place.ps1 pick one at
  # session start. BUILD_ID is what they compare to skip a re-copy.
  plugin:
    needs: binary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: assemble plugin/dist
        run: |
          set -eu
          for pair in Windows-X64:windows-x64 macOS-ARM64:macos-arm64 Linux-X64:linux-x64; do
            src="artifacts/bdxguard-${pair%%:*}"
            dst="plugin/dist/${pair##*:}"
            test -d "$src"
            mkdir -p plugin/dist
            cp -R "$src" "$dst"
            echo "$GITHUB_SHA" > "$dst/BUILD_ID"
          done
          # upload-artifact drops the executable bit
          chmod +x plugin/dist/*/bdxguard plugin/dist/*/bdxguard.exe plugin/scripts/place.sh
          (cd plugin && zip -qr ../boxdawn-guard-plugin.zip .)
          sha256sum boxdawn-guard-plugin.zip | tee boxdawn-guard-plugin.zip.sha256
          ls -la boxdawn-guard-plugin.zip
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate ./plugin && claude plugin validate .
      - uses: actions/upload-artifact@v4
        with:
          name: boxdawn-guard-plugin
          path: |
            boxdawn-guard-plugin.zip
            boxdawn-guard-plugin.zip.sha256
          retention-days: 7
