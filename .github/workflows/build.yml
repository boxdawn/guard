name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # Private-repo Actions minutes are counted per OS (macOS and Windows
  # several times Linux), so a pull request or a push to main builds on
  # Linux only. A manual run and a release tag build all five, with the
  # plugin and the real-session test. Run one by hand before merging.
  binary:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && '["windows-latest", "macos-latest", "macos-15-intel", "ubuntu-latest", "ubuntu-24.04-arm"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" "pyinstaller==6.22.3"
      - run: python -c "import tree_sitter_bash"
      # The PowerShell reader (Windows only). With BDX_REQUIRE_PSPARSE the
      # PowerShell tests fail instead of skipping when it is missing.
      - name: build PowerShell reader
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -NoProfile -File packaging/psparse/build.ps1 build/psparse
          Add-Content -Encoding ascii $env:GITHUB_ENV "BDX_PSPARSE=$pwd\build\psparse\bdxpsparse.exe"
          Add-Content -Encoding ascii $env:GITHUB_ENV "BDX_REQUIRE_PSPARSE=1"
      - run: python -m pytest boxdawn_guard -q
      # PyInstaller does not cross-compile: each OS builds its own binary.
      - run: pyinstaller packaging/bdxguard.spec --noconfirm
      - name: PowerShell reader next to the binary
        if: runner.os == 'Windows'
        shell: bash
        run: cp build/psparse/bdxpsparse.exe dist/bdxguard/
      # Fails the job if the binary's output differs from the Python code's
      # on any sample command.
      - name: binary matches the Python code
        shell: bash
        run: |
          exe=dist/bdxguard/bdxguard
          [ -f "$exe.exe" ] && exe="$exe.exe"
          python packaging/check_binary.py "$exe" 21
      # The built binary reaches the real server over TLS (a Python build can
      # lack CA certificates on macOS). A made-up key must come back refused
      # (401); a TLS or network failure says "unreachable" and fails the job.
      - name: binary reaches the rules server
        shell: bash
        run: |
          exe=dist/bdxguard/bdxguard
          [ -f "$exe.exe" ] && exe="$exe.exe"
          d=$(mktemp -d)
          out=$(CLAUDE_PLUGIN_OPTION_API_KEY=bdk_ci_not_a_key CLAUDE_PLUGIN_DATA="$d" "$exe" fetch-rules 2>&1)
          echo "$out"
          case "$out" in *"refused (401)"*) ;; *) exit 1 ;; esac
      - uses: actions/upload-artifact@v4
        with:
          name: bdxguard-${{ runner.os }}-${{ runner.arch }}
          path: dist/bdxguard
          retention-days: 7

  # One plugin carries every OS's build; place.sh / place.ps1 pick one at
  # session start. BUILD_ID is what they compare to skip a re-copy, VERSION
  # what keeps an older plugin folder from replacing a newer build.
  plugin:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: binary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: assemble plugin/dist
        run: |
          set -eu
          v=$(python3 -c "import json; print(json.load(open('plugin/.claude-plugin/plugin.json'))['version'])")
          for pair in Windows-X64:windows-x64 macOS-ARM64:macos-arm64 macOS-X64:macos-x64 Linux-X64:linux-x64 Linux-ARM64:linux-arm64; do
            src="artifacts/bdxguard-${pair%%:*}"
            dst="plugin/dist/${pair##*:}"
            test -d "$src"
            mkdir -p plugin/dist
            cp -R "$src" "$dst"
            echo "$GITHUB_SHA" > "$dst/BUILD_ID"
            echo "$v" > "$dst/VERSION"
          done
          # upload-artifact drops the executable bit
          chmod +x plugin/dist/*/bdxguard plugin/dist/*/bdxguard.exe plugin/scripts/place.sh
          (cd plugin && zip -qr ../boxdawn-guard-plugin.zip .)
          sha256sum boxdawn-guard-plugin.zip | tee boxdawn-guard-plugin.zip.sha256
          ls -la boxdawn-guard-plugin.zip
      # The GitHub Copilot CLI plugin: the same builds and place scripts under
      # plugin-copilot's own manifest and hooks. Copilot installs from a git
      # ref, not a zip, so the release pushes this tree to boxdawn/guard-copilot.
      - name: assemble the Copilot plugin
        run: |
          set -eu
          rm -rf copilot && mkdir copilot
          cp -R plugin-copilot/. copilot/
          cp -R plugin/scripts copilot/scripts
          cp -R plugin/dist copilot/dist
          chmod +x copilot/dist/*/bdxguard copilot/dist/*/bdxguard.exe copilot/scripts/place.sh
          tar -czf boxdawn-guard-copilot.tar.gz -C copilot .
          ls -la boxdawn-guard-copilot.tar.gz
      # One archive per OS for the directory plugin (boxdawn/guard-plugin),
      # which downloads only its own machine's build at session start. tar.gz
      # everywhere: Windows 10+ ships tar.exe, minimal Linux may lack unzip.
      - name: per-OS archives
        run: |
          set -eu
          mkdir archives
          for d in plugin/dist/*/; do
            n=$(basename "$d")
            tar -czf "archives/bdxguard-$n.tar.gz" -C "$d" .
          done
          (cd archives && sha256sum *.tar.gz | tee bdxguard-archives.sha256)
          ls -la archives
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate ./plugin && claude plugin validate .
      - uses: actions/upload-artifact@v4
        with:
          name: boxdawn-guard-plugin
          path: |
            boxdawn-guard-plugin.zip
            boxdawn-guard-plugin.zip.sha256
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: bdxguard-archives
          path: archives
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: boxdawn-guard-copilot
          path: boxdawn-guard-copilot.tar.gz
          retention-days: 7

  # Real Claude Code sessions against the installed plugin. Costs API calls
  # (haiku, ~14 sessions per OS), so it runs only when started by hand.
  runtime:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: plugin
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: boxdawn-guard-plugin
      - name: unpack plugin
        shell: bash
        run: mkdir assembled && cd assembled && unzip -q ../boxdawn-guard-plugin.zip
      - run: npm install -g @anthropic-ai/claude-code
      # One plain session first, so a failure to start Claude Code at all
      # shows up here with its own output instead of as 14 empty failures.
      - name: claude starts
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          claude -p "Reply with the single word OK" --model claude-haiku-5-5 --output-format json > out.json 2> err.txt
          echo "exit=$?"
          echo "--- stdout"; head -c 1500 out.json; echo
          echo "--- stderr"; head -c 1500 err.txt; echo
          claude -p "Reply with the single word OK" > out2.txt 2>&1
          echo "plain exit=$?"; head -c 800 out2.txt
      - name: real sessions against the installed plugin
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "::error::ANTHROPIC_API_KEY secret is not set"; exit 1; }
          python packaging/runtime_test.py assembled

  # The directory edition (boxdawn/guard-plugin) as the directory installs
  # it, the git folder as it is: the first session downloads the pinned
  # release build from GitHub and checks its sha256. By hand only.
  directory:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: boxdawn/guard-plugin
          path: guard-plugin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install -g @anthropic-ai/claude-code
      - name: real sessions against the directory edition
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "::error::ANTHROPIC_API_KEY secret is not set"; exit 1; }
          python packaging/runtime_test.py guard-plugin --no-search

  # A tag v<version> (or v<version>-rc.N) publishes, after the real-session
  # test above passed on every OS: the zip and its sha256 become a GitHub
  # release, and a branch release/<tag> points the marketplace at that zip
  # (archive source, sha256 pinned). Users get it only when someone opens
  # and merges a PR from that branch.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: boxdawn-guard-plugin
      - uses: actions/download-artifact@v4
        with:
          name: bdxguard-archives
          path: archives
      - uses: actions/download-artifact@v4
        with:
          name: boxdawn-guard-copilot
      - name: tag matches the plugin version
        run: |
          v=$(python3 -c "import json; print(json.load(open('plugin/.claude-plugin/plugin.json'))['version'])")
          case "$GITHUB_REF_NAME" in
            "v$v"|"v$v"-rc.*) ;;
            *) echo "::error::tag $GITHUB_REF_NAME does not match plugin version $v"; exit 1 ;;
          esac
          sha256sum -c boxdawn-guard-plugin.zip.sha256
          (cd archives && sha256sum -c bdxguard-archives.sha256)
      # The Copilot plugin goes to its own public repository, one tag per
      # release, so this repository (which Claude Code clones for the
      # marketplace) does not grow by every build. Without the deploy key the
      # Claude release goes on alone.
      - name: Copilot plugin repository
        id: copilot
        env:
          KEY: ${{ secrets.COPILOT_DIST_DEPLOY_KEY }}
        run: |
          set -eu
          if [ -z "$KEY" ]; then
            echo "::warning::COPILOT_DIST_DEPLOY_KEY is not set: no Copilot build for $GITHUB_REF_NAME"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          v=$(python3 -c "import json; print(json.load(open('plugin-copilot/plugin.json'))['version'])")
          case "$GITHUB_REF_NAME" in
            "v$v"|"v$v"-rc.*) ;;
            *) echo "::error::tag $GITHUB_REF_NAME does not match the Copilot plugin version $v"; exit 1 ;;
          esac
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/copilot_dist
          chmod 600 ~/.ssh/copilot_dist
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/copilot_dist -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q git@github.com:boxdawn/guard-copilot.git dist-repo
          find dist-repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir dist-repo/plugin
          tar -xzf boxdawn-guard-copilot.tar.gz -C dist-repo/plugin
          cp LICENSE.md dist-repo/
          printf '%s\n' "# Boxdawn guard for GitHub Copilot CLI" "" \
            "Built files only. Source, install steps and limits: https://github.com/boxdawn/guard" \
            "" "This build: $GITHUB_REF_NAME, from boxdawn/guard $GITHUB_SHA." > dist-repo/README.md
          git -C dist-repo add -A
          git -C dist-repo -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "boxdawn-guard $GITHUB_REF_NAME, built from boxdawn/guard $GITHUB_SHA"
          git -C dist-repo tag "$GITHUB_REF_NAME"
          git -C dist-repo push -q origin HEAD:main "refs/tags/$GITHUB_REF_NAME"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-rc.*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" boxdawn-guard-plugin.zip boxdawn-guard-plugin.zip.sha256 \
            archives/bdxguard-*.tar.gz archives/bdxguard-archives.sha256 \
            $pre --title "boxdawn-guard $GITHUB_REF_NAME" \
            --notes "Built from $GITHUB_SHA. sha256: $(cut -d' ' -f1 boxdawn-guard-plugin.zip.sha256)"
      - name: marketplace branch
        env:
          COPILOT_PUSHED: ${{ steps.copilot.outputs.pushed }}
        run: |
          git fetch -q origin main
          git switch -q -c "release/$GITHUB_REF_NAME" origin/main
          python3 - <<'PY'
          import json, os
          path = ".claude-plugin/marketplace.json"
          m = json.load(open(path))
          tag = os.environ["GITHUB_REF_NAME"]
          sha = open("boxdawn-guard-plugin.zip.sha256").read().split()[0]
          (entry,) = [e for e in m["plugins"] if e["name"] == "boxdawn-guard"]
          entry["source"] = {
              "source": "archive",
              "url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/boxdawn-guard-plugin.zip",
              "sha256": sha,
          }
          with open(path, "w") as f:
              json.dump(m, f, indent=2)
              f.write("\n")
          # Copilot reads .github/plugin/marketplace.json when there is one.
          if os.environ.get("COPILOT_PUSHED") == "true":
              v = json.load(open("plugin-copilot/plugin.json"))["version"]
              os.makedirs(".github/plugin", exist_ok=True)
              with open(".github/plugin/marketplace.json", "w") as f:
                  json.dump({"name": m["name"], "owner": m["owner"], "plugins": [{
                      "name": "boxdawn-guard", "version": v,
                      "description": "Judges each shell command before GitHub Copilot CLI runs it: deny, ask, or no decision.",
                      "source": {"source": "github", "repo": "boxdawn/guard-copilot", "ref": tag, "path": "plugin"},
                  }]}, f, indent=2)
                  f.write("\n")
          PY
          git add -A .claude-plugin
          if [ -d .github/plugin ]; then git add -A .github/plugin; fi
          git diff --cached
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "release: point the marketplace at $GITHUB_REF_NAME"
          git push -q origin "release/$GITHUB_REF_NAME"
          echo "Open a PR: https://github.com/$GITHUB_REPOSITORY/compare/main...release/$GITHUB_REF_NAME"
